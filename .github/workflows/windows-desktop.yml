name: Windows desktop trial

on:
  push:
    branches: [main, habit-builder-iteration]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements-build.txt
      - name: Install packager
        run: python -m pip install -r desktop/requirements-build.txt
      - name: Run desktop tests
        run: python -m unittest discover -s desktop/tests -v
      - name: Check Tkinter and compile sources
        run: |
          python -c "import tkinter; import _tkinter"
          python -m py_compile desktop/ai.py desktop/storage.py desktop/quest.py
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Quest --paths desktop desktop/quest.py
      - name: Upload Windows app
        uses: actions/upload-artifact@v7
        with:
          name: Quest-Windows-test
          path: dist/Quest.exe
          if-no-files-found: error
          retention-days: 14
