name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0"

      - name: Configure stable debug signing
        env:
          QUEST_DEBUG_KEYSTORE_BASE64: ${{ secrets.QUEST_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$QUEST_DEBUG_KEYSTORE_BASE64"
          signing_dir="$RUNNER_TEMP/android-user-home"
          mkdir -p "$signing_dir"
          printf '%s' "$QUEST_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/debug.keystore"
          keytool -list -keystore "$signing_dir/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
          echo "ANDROID_USER_HOME=$signing_dir" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build Debug APK and Android test APK
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Verify APK signing certificate
        run: |
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: quest-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
